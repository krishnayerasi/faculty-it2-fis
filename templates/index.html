<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Performance Evaluation — IT1 vs IT2 Fuzzy System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        h1 { text-align: center; margin-bottom: 10px; color: #1a237e; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .input-panel { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .input-group { display: flex; align-items: center; margin-bottom: 15px; }
        .input-group label { width: 250px; font-weight: 600; font-size: 14px; }
        .input-group input[type="range"] { flex: 1; margin: 0 15px; }
        .input-group .value { width: 50px; text-align: center; font-weight: bold; font-size: 16px; color: #1a237e; }
        .btn { display: block; width: 100%; padding: 14px; background: #1a237e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #283593; }
        .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .result-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .result-card h3 { margin-bottom: 15px; color: #1a237e; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
        .grade { font-size: 36px; font-weight: bold; text-align: center; margin: 15px 0; }
        .grade.it1 { color: #e65100; }
        .grade.it2 { color: #1b5e20; }
        .label-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .label-badge.high { background: #e8f5e9; color: #2e7d32; }
        .label-badge.moderate { background: #fff3e0; color: #ef6c00; }
        .label-badge.low { background: #fce4ec; color: #c62828; }
        .interval { text-align: center; font-size: 14px; color: #666; margin: 10px 0; }
        .detail-section { margin-top: 15px; }
        .detail-section h4 { font-size: 13px; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .rule-row { font-size: 12px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
        .rule-row span { font-weight: 600; color: #1a237e; }
        .explanation { background: #f5f5f5; border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; font-family: 'Courier New', monospace; max-height: 300px; overflow-y: auto; }
        .loading { text-align: center; padding: 40px; color: #999; }
        @media (max-width: 768px) { .results { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Faculty Performance Evaluation System</h1>
        <p class="subtitle">Hierarchical Interval Type‑2 (IT2) vs Type‑1 (IT1) Fuzzy Inference — with Built‑in Explainability</p>

        <div class="input-panel">
            <h3>📝 Enter Faculty Scores (0–100)</h3>
            <div class="input-group">
                <label>Academic Management (AM)</label>
                <input type="range" id="AM" min="0" max="100" value="0" oninput="updateValue('AM')">
                <span class="value" id="AM-val">0</span>
            </div>
            <div class="input-group">
                <label>Student Exam Performance (SEP)</label>
                <input type="range" id="SEP" min="0" max="100" value="0" oninput="updateValue('SEP')">
                <span class="value" id="SEP-val">0</span>
            </div>
            <div class="input-group">
                <label>Continuous Learning (CL)</label>
                <input type="range" id="CL" min="0" max="100" value="0" oninput="updateValue('CL')">
                <span class="value" id="CL-val">0</span>
            </div>
            <div class="input-group">
                <label>Activity Coordination (AC)</label>
                <input type="range" id="AC" min="0" max="100" value="0" oninput="updateValue('AC')">
                <span class="value" id="AC-val">0</span>
            </div>
            <div class="input-group">
                <label>Research Contribution (RC)</label>
                <input type="range" id="RC" min="0" max="100" value="0" oninput="updateValue('RC')">
                <span class="value" id="RC-val">0</span>
            </div>
            <button class="btn" onclick="runEvaluation()">🔍 Evaluate Faculty</button>
        </div>

        <div id="results-container"></div>
    </div>

    <script>
        function updateValue(id) {
            document.getElementById(id + '-val').textContent = document.getElementById(id).value;
        }

        async function runEvaluation() {
            const container = document.getElementById('results-container');
            container.innerHTML = '<div class="loading">⏳ Evaluating... Please wait...</div>';

            const data = {
                AM: parseFloat(document.getElementById('AM').value),
                SEP: parseFloat(document.getElementById('SEP').value),
                CL: parseFloat(document.getElementById('CL').value),
                AC: parseFloat(document.getElementById('AC').value),
                RC: parseFloat(document.getElementById('RC').value)
            };

            try {
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success) {
                    renderResults(result);
                } else {
                    container.innerHTML = `<div class="loading">❌ Error: ${result.error}</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="loading">❌ Connection error. Is the server running?</div>`;
            }
        }

        function renderResults(result) {
            const it1 = result.it1;
            const it2 = result.it2;

            const html = `
                <div class="results">
                    <div class="result-card">
                        <h3>📊 IT1 (Type‑1 Sugeno)</h3>
                        <div class="grade it1">${it1.PerformanceGrade}</div>
                        <div style="text-align:center;"><span class="label-badge moderate">${it1.PerformanceLabel}</span></div>
                        <div class="interval">Teaching Score: ${it1.TeachingScore} (${it1.TeachingLabel})</div>
                        <div class="interval" style="color:#c62828;">⚠ No uncertainty interval</div>
                        <div class="detail-section">
                            <h4>🔍 Fired Rules (Stage 2)</h4>
                            ${it1.Stage2_Rules.slice(0, 3).map(r => `
                                <div class="rule-row">
                                    Rule <span>#${r.rule_index}</span>:
                                    IF TeachingScore is <span>${r.antecedents[0]}</span>,
                                    AC is <span>${r.antecedents[1]}</span>,
                                    RC is <span>${r.antecedents[2]}</span>
                                    → <span>${r.consequent}</span>
                                    (μ = ${r.firing_strength.toFixed(3)})
                                </div>
                            `).join('')}
                        </div>
                        <div class="detail-section">
                            <h4>🧠 Explanation</h4>
                            <div class="explanation">${it1.Explanation}</div>
                        </div>
                    </div>

                    <div class="result-card" style="border: 2px solid #1b5e20;">
                        <h3>🌟 IT2 (Interval Type‑2) <span style="font-size:11px;color:#1b5e20;">— Our Model</span></h3>
                        <div class="grade it2">${it2.PerformanceGrade}</div>
                        <div style="text-align:center;"><span class="label-badge high">${it2.PerformanceLabel}</span></div>
                        <div class="interval">Teaching Score: ${it2.TeachingScore} (${it2.TeachingLabel})</div>
                        <div class="interval" style="color:#1b5e20;font-weight:600;">📏 Uncertainty Interval: [${it2.Interval[0]}, ${it2.Interval[1]}]</div>
                        <div class="detail-section">
                            <h4>🔍 Fired Rules (Stage 2)</h4>
                            ${it2.Stage2_Rules.slice(0, 3).map(r => `
                                <div class="rule-row">
                                    Rule <span>#${r.rule_index}</span>:
                                    IF TeachingScore is <span>${r.antecedents[0]}</span>,
                                    AC is <span>${r.antecedents[1]}</span>,
                                    RC is <span>${r.antecedents[2]}</span>
                                    → <span>${r.consequent}</span>
                                    (fNT = ${r.fNT.toFixed(3)})
                                </div>
                            `).join('')}
                        </div>
                        <div class="detail-section">
                            <h4>🧠 Explanation</h4>
                            <div class="explanation">${it2.Explanation}</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('results-container').innerHTML = html;
        }
    </script>
</body>
</html>
